<!DOCTYPE html>
<html lang="vi" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ngô Minh Nhựt — console</title>
    <meta name="description" content="Portfolio dạng dòng lệnh của Ngô Minh Nhựt, lập trình viên Fullstack.">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="terminal.css">
</head>

<body>
    <div class="term-app">

        <header class="term-topbar">
            <div class="term-title mono">
                <span class="term-dot" aria-hidden="true"></span>
                <span>ken@fullstack<span class="dim">:~$</span></span>
            </div>
            <div class="term-status mono" id="termClock" aria-hidden="true">TP.HCM · GMT+7</div>
            <nav class="controls">
                <a class="toggle-btn" href="./index.html">
                    <span data-i18n="nav.dashboard">Xem bản Dashboard</span>
                </a>
                <a class="toggle-btn" href="./story.html">
                    <span data-i18n="nav.story">Xem bản Story</span>
                </a>
                <button class="toggle-btn" id="langToggle" type="button">VI / EN</button>
                <button class="toggle-btn" id="themeToggle" type="button" aria-label="Đổi giao diện sáng/tối">
                    <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path
                            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4">
                        </path>
                    </svg>
                    <span id="themeLabel">Dark</span>
                </button>
            </nav>
        </header>

        <main class="term-output mono" id="termOutput" aria-live="polite" tabindex="-1"></main>

        <div class="term-chips mono" id="termChips" aria-label="Lệnh nhanh"></div>

        <form class="term-inputrow" id="termForm" autocomplete="off">
            <label class="term-prompt mono" for="termInput">ken@fullstack:~$</label>
            <input class="term-input mono" id="termInput" name="termInput" type="text" autocomplete="off"
                autocapitalize="off" autocorrect="off" spellcheck="false"
                aria-label="Nhập lệnh, gõ help để xem danh sách" />
        </form>

    </div>

    <script src="shared.js"></script>
    <script src="terminal.js"></script>
</body>

</html>
